<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dana Aljehani | Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="contact-page">

  <div class="container">

    <header class="tabs-wrap">
      <div class="tabs-bar"></div>
      <nav>
        <ul class="tabs">
          <li class="tab"><a class="tab-home" href="index.html">HOME</a></li>
          <li class="tab"><a class="tab-profile" href="profile.html">PROFILE</a></li>
          <li class="tab"><a class="tab-contact active" href="contact.html">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <main class="folder">
      <section class="paper">

        <h1 class="hero-title">CONTACT</h1>

        <section class="card">
          <h2 class="section-title">EMAIL</h2>
          <p>
            <a href="mailto:Y4F441500055@rcjy.edu.sa">Y4F441500055@rcjy.edu.sa</a>
          </p>
        </section>

        <section class="card">
          <h2 class="section-title">SEND A MESSAGE</h2>

          <form>
            <div>
              <label for="fullname">Full Name</label>
              <input id="fullname" type="text" required>
            </div>

            <div>
              <label for="email">Email</label>
              <input id="email" type="email" required>
            </div>

            <div>
              <label for="subject">Subject</label>
              <input id="subject" type="text">
            </div>

            <div>
              <label for="message">Message</label>
              <textarea id="message" rows="6"></textarea>
            </div>

            <button type="submit">Send</button>
          </form>
        </section>

        <p class="footer">© 2026 Dana Aljehani. Designed for CS381.</p>

      </section>
    </main>

  </div>

</body>
</html>
